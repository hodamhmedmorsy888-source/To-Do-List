name: My First Workflow

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: "docker login"
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}
      - name: "building image"
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/Todolist .
      - name: "push to docker hub"
        run: docker push ${{ secrets.DOCKER_USERNAME }}/Todolist